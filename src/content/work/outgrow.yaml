  - blocks:
      - type: head
        label: The OUTCOME
        num: "005"
        title: Income, not just information.
        sub: "The measure of success was never screen time - it was the balance sheet of a farm. By replacing a scatter of half-trusted sources with one credible, multilingual place, Outgrow turned scattered advice into the kind farmers could act on - and farmers in the program saw it land where it matters most: their income."
      - type: stats
        grid: true
        items:
          - big: <em>20 - 40</em><small>%</small>
            label: Income increase for Outgrow farmers
            src: Outgrow program — WayCool, 2022
          - big: <em>100K</em><small>+</small>
            label: Downloads on Google Play
            src: Cumulative, app-level — Google Play
          - big: <em>2,500</em><small>+</small>
            label: Markets feeding live prices
            src: Per Google Play listing
          - { big: <em>6</em>, label: "Languages, fully localised", src: EN · TA · TE · KN · MR · HI }
      - type: callout
        tone: solid
        title: What I learned
        body: Designing for users I'd never meet in a lab forced a discipline I'm proud of every decision had to survive a dusty field, a small screen, low connectivity, and …
        quote: “The hard part wasn't adding features. It was earning enough trust to replace five.”
