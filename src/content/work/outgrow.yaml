  - blocks:
      - type: head
        label: The solution
        num: "004"
        title: One app for the whole farming cycle.
        sub: Those research-driven features came to life as a single, calm interface — every service a tap away, every screen readable in bright field light and in the farmer's own language.
      - type: takeaways
        label: Key Take-aways
        items:
          - Real Time Market Price Access.
          - Farm Data Analysis and Health Monitoring and NDVI Scores
          - Weather and Climatic Condition.
          - Expert Advisory Information about Crops.
          - Farmers get information about each Crop and how to product and how to remedy if any diseases spread across.
          - Outgrow partnered service will help on the soil testing by collecting data from the field.
