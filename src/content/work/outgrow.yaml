sections:
  - blocks:
      - type: head
        label: The Setup
        num: "001"
        title: A Farmer network, <em>Three years</em> in the making.
        sub:
          - Outgrow is the farmer-engagement platform from <b>WayCool Labs</b>, the technology arm of Chennai's WayCool Foods. Long before any app, agronomists and field advisors of Outgrow had spent <b>over three years working alongside farmers on the ground</b> - building a network of more than 85,000 of them.
          - "In March 2022, that on-ground knowledge became a free - launched in six languages across five states, with one stated mission: <b>To raise the income and profitability of small and marginal farmers, and ultimately reach five million of them.</b>"
      - type: stats
        items:
          - big: <em>85,000</em><small>+</small>
            label: farmers in the Outgrow network at launch
            src: WayCool Foods, 2022
          - big: <em>3</em><small>+yrs</small>
            label: on the ground before the app existed
            src: Outgrow extension program
          - big: <em>5M</em><small>+</small>
            label: farmers the platform aims to reach
            src: Stated goal — WayCool
