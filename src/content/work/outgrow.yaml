      label: Banner
  - blocks:
      - type: callout
        tone: alt
        title: UX Strategy & Methodology
        body: I combined field visits with farmers, a competitor scan of existing agri-advisory apps, and persona synthesis to ground every decision in real usage, not assumptions
        chips: [ Field Interviews, Competitor Analysis, Persona Synthesis ]
  - blocks:
      - type: head
        label: The problem
        num: "002"
        title: What we heard, again and again.
        sub:
          - Across every conversation, the same picture emerged. Farmers like Gandhi and Murugan didn't lack information - they were lost in scattered, unsolicited advice with no single source to trust. And for farmers on thin margins, that uncertainty translates straight into lost income.
          - "Listing the pains as we understood them from the field:"
      - type: points
        small: true
        items:
          - title: No water & irrigation guidance
            text: No reliable way to plan irrigation or manage water across the farm.
          - title: Scattered, untrusted advice
            text: Overexposed to unsolicited tips from many sources, with no single voice to trust.
          - title: No help with high-yield crops
            text: Little guidance on managing or improving yield for demanding crops.
          - title: Opaque, late prices
            text: Mandi rates arrive late & unclear, leaving farmers at the mercy of middlemen.
          - title: Insights that come too late
            text: Soil and crop-health information rarely arrives in time to act on it.
          - title: A language barrier
            text: Most digital tools simply don't speak the farmer's mother tongue.
      - type: callout
        tone: alt quote
        title: "\"Today, a farmer depends on multiple platforms and at times is overexposed to unsolicited advisory sources.\""
        by: "- Sendhil Kumar · Head of Farmer Engagement & Outgrow, WayCool Foods"
  - blocks:
      - type: head
        label: Our research
        title: We started where the farmers are.
        sub:
          - Building on this farmer-engagement platform, the two of us, A small design team - went into the field ourselves. We ran a survey across farming households, sat with farmers on their own land, and watched how they plan, plant, price, and sell across a season.
          - "The goal was simple: understand the real pain points, not the assumed ones."
      - type: tags
        items: [ Field survey, Contextual interviews, On-farm observation, Persona synthesis ]
      - type: personas
        tint: true
        items:
          - img: "13764:3606"
            name: Gandhi
            age: User Age (66)
            traits: [ Hardworking, Punctual, Observant, Problem-solver ]
            lists:
              Goals: [ More information to manage all his crops, "Updates on crops, Irrigation & prices" ]
              Pain points: [ No good mechanism for water irrigation, No proper guidance for high-yield crops ]
          - img: "13764:3632"
            name: Murugan
            age: User Age (38)
            traits: [ Curious, Cost-conscious, Tech-ready, Persistent ]
            lists:
              Goals: [ "Sell at fair, transparent prices", Adopt modern methods to raise yield ]
              Pain points: [ Middlemen and unclear mandi rates cut margins, No early warning for pests or bad weather ]
  - blocks:
      - type: head
        label: The Process
        num: "003"
        title: Three principles we locked in early
        sub: Working back from the research, we mapped each pain to a concrete, science-backed feature — the set of solutions that became Outgrow.
      - type: features
        items:
          - title: Real-time market price
            text: Live Mandi rates from 2,500+ markets, so farmers sell at the right price - not a middleman's.
          - title: Farm data & NDVI
            text: Add a farm area and monitor it - farm data analysis, health monitoring and NDVI scores across the season.
          - title: Weather & climate
            text: Farm-specific forecasts and microclimatic conditions, with early disease-risk alerts ahead of trouble.
          - title: Expert advisory
            text: Agronomist guidance on crops by voice, text or IVR method (Customer Support) - in the farmer's own language.
          - title: Crop information & Solution
            text: How to grow each crop, and how to remedy disease the moment it spreads - backed by 500+ remedies.
          - title: Soil testing
            text: An Outgrow partner service collects soil from the field and turns it into an actionable report.
