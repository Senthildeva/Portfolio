  - blocks:
      - type: head
        label: The Solution
        num: "004"
        title: Detailed tracking, <em>Shaped by hierarchy.</em>
        sub: One dashboard covering orders, financials and targets - where the same system reshapes itself for every login, from a Zonal Head's overview down to a single Sales Executive's day.
      - type: principles
        tone: card
        items:
          - title: <em>5 levels,</em> <b>one source of truth</b>
            text: Login decides scope — aggregate at the top, a person's own orders and targets at the bottom.
          - title: 8 categories, <b>only one frame</b>
            text: Mismatched category data made comparable — switch the tab, keep the same analytics layout.
          - title: Target vs achieved, <b>at a glance</b>
            text: Over- and under-achievement read instantly, with a per-category breakdown in crores.
