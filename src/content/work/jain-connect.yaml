sections:
  - blocks:
      - type: head
        label: The Setup
        num: "001"
        title: "A new brief: The dashboard <em>behind the dealer network.</em>"
        sub:
          - "With the customer-facing showcasing app shipped, the client came back with a very different brief: an <b>Admin-and-Dealer application</b> built entirely around hierarchy, salesperson data and managerial activity."
          - A salesperson needed to raise a new order, manage it through to delivery, and track the financials behind it - while every level above them saw the orders, payments and targets relevant to their role.
      - type: stats
        items:
          - big: <em>8</em>
            label: Drip Irrigation · Sprinkler · Solar · Tissue Culture · PVC · Food Processing · Renewable Energy & more
            src: Product categories in one comparison view
          - big: <em>5</em>
            label: Aggregated reports down to individual performance (Sales, targets, performance)
            src: Management levels, top to salesperson
          - big: <em>1</em><small>st</small>
            label: Extra attention went into usability, and it pushed me to think in more directions towards solutions.
            src: My first dashboard project
  - full:
      type: image
      img: "13779:1726"
      w: 1440
      h: 250
      bleed: true
      alt: ""
      label: Banner
  - blocks:
      - type: callout
        title: UX Strategy & Methodology
        body: I ran structured interviews across two hierarchy levels, mapped the existing data model by hand, and validated each design decision against a real sales scenario before building it.
        chips: [ Stakeholder Interviews, Data Modeling, Hierarchy Mapping ]
  - blocks:
      - type: head
        label: The problem
        num: "002"
        title: The old system was <em>too simple to be useful.</em>
        sub: "Across conversations with Salespersons and managers, one thing kept surfacing - the system held all the data, but gave nobody a way to act on it. Listing the pains as we understood them from the field:"
      - type: points
        heading: Reframed as user problems
        small: true
        items:
          - title: No order categorisation
            text: Pending and dispatched orders shown as one flat list, with no way to filter across 8 product categories.
          - title: Categories that didn't compare
            text: Each product category tracked on a different scale — comparing performance across them meant manual cross-referencing.
          - title: One dashboard, five roles
            text: The same screen served sales persons, regional managers and top management, with no way to see only what a role actually needed.
          - title: Account status buried
            text: Outstanding amounts and balances lived outside the daily order flow, so sales persons had no early warning on dues.
          - title: No target-vs-actual view
            text: Sales targets and achieved numbers sat in separate reports, with no simple way to see how far off the target you were.
          - title: Built for a desk, used on the move
            text: Dealers needed this in the field, but the existing system assumed a browser and a desk.
      - { type: subhead, text: What Jain Connect does }
      - type: principles
        tone: card
        items:
          - title: Raise, Manage and Track Orders
            text: A salesperson creates an order, follows it through dispatch, and tracks the truck and its financials.
          - title: Analyse Sales and Targets
            text: Achieved sales against monthly targets - for an individual and at every hierarchy level.
          - title: Hierarchy - level Management
            text: Five levels, one system - each role sees the depth of data it actually needs.
      - type: callout
        tone: solid
        title: Aha Moment !
        body: <b>Both Rajeev and Sunil were drowning in the same flat data.</b> The fix wasn't more numbers — it was shaping the data to whoever was looking. Aggregate at the top, detail at the bottom, and let the login decide the view. That single insight set the direction for everything that followed.
  - blocks:
      - type: head
        label: Our research
        title: <em>How we got here</em>
        sub: Before designing anything, we grounded the brief in how the sales team actually works — talking to the people who live in this data every day.
      - type: stats
        items:
          - big: <em>3</em>
            label: Connected virtually with salespeople the client arranged - hearing how orders and targets really move on the ground.
            src: Salesperson interviews
          - big: <em>2</em>
            label: Admin (behind the customer view) and dealer - one system serving very different needs and permissions.
            src: Sides to design for
          - icon: "13779:1857"
            label: Studied comparable admin and dealer apps to borrow patterns worth keeping and spot gaps worth fixing.
            src: Competitor scan
      - { type: subhead, text: Who felt it — two ends of the hierarchy }
      - type: personas
        tint: true
        items:
          - img: "13779:1869"
            name: Rajeev
            age: Regional Manager · Age 40
            traits: [ Organized, Thinker, Introvert ]
            lists:
              Goals: [ Consistently hit sales targets and exceed quotas., Develop and manage a high-performing sales team. ]
              Pain points:
                - No hierarchy structure across order sales and performance metrics.
                - Managing complex sales cycles with many order statistics.
              Behaviours:
                - Regularly reviews sales data and performance metrics.
                - Proactively identifies and addresses customer concerns.
          - img: "13779:1897"
            name: Sunil
            age: Sales Person · Age 29
            traits: [ Overloaded work, Reactive, Field-first, Persistent ]
            lists:
              Goals: [ Finally hit this month's target after falling short., Know which orders and categories to chase first. ]
              Pain points:
                - Trailing target with no clear view of the gap left to close.
                - Loses track of pending vs. dispatched orders and outstanding payments.
              Behaviours: [ "Works mostly from mobile, out in the field.", Reacts to whatever is urgent instead of planning ahead. ]
  - blocks:
      - type: head
        label: The Process
        num: "003"
        title: From flat data to <em>3 design decisions.</em>
        sub: We took the pain points from the interviews and the data-driven findings from the research and converted each one into a concrete design decision. Working closely with my senior and the client, I mapped every metric the sales team relied on, then tested where it belonged in the hierarchy — three decisions did most of the heavy lifting.
      - type: steps
        items:
          - title: Map the metrics
            text: Listed every number each role needs, across all eight categories.
          - title: Shape by hierarchy
            text: Decided what each of the five levels should see, and at what depth.
          - title: Design & iterate
            text: Built one reusable frame so categories stay comparable at a glance.
          - title: Refine post-launch
            text: Folded real client and sales-team feedback into three revisions.
