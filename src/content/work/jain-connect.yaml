  - blocks:
      - type: head
        label: The Outcome
        num: "005"
        title: One dashboard, five levels, <em>decisions in a glance.</em>
      - type: points
        small: true
        items:
          - kicker: take away
            text: A real understanding of hierarchy-level design - modelling how the same data should change shape as it moves up and down an organisation.
          - kicker: take away
            text: My first time handling the admin app - the layer behind the customer view - and designing for permissions, not just screens.
          - kicker: shipped as
            text: Detailed tracking of pending and dispatched orders with truck tracking, segmented across all 8 product categories.
          - kicker: shipped as
            text: Login-based visibility - higher managers see orders, payments and targets across every location; a salesperson sees only their own.
      - type: callout
        tone: solid
        deco: "13779:2462"
        title: What I learned
        body: As my <b>1st dashboard Project</b> - and my first admin app behind a customer-facing product - this project reshaped how I think about presenting data. <b>I learned to design around hierarchy</b> and <b>login-based permissions</b>, and to <b>structure complex</b>, mismatched data into something a busy salesperson can actually read and act on.
        quote: "\"The best dashboards don't show more — they show less, to the right person.\""
