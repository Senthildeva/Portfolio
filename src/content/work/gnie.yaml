  - blocks:
      - type: head
        label: The Outcome
        num: "005"
        title: What the booth delivered - <i class="g">Elevating Gapblue’s Presence at Gitex 2024</i>
        sub:
          - Five kiosks. Five days. Zero downtime. The PWA ran fully offline - capturing leads and distributing rewards from Day 1 through Futuristic Friday without a single failure.
          - By Day 3, Gapblue reported <b>"Fast gaining momentum, with increased footfalls"</b> and introductions to <b>"Various industry leaders."</b> The scratch-and-win mechanic was the hook that made people stop.
