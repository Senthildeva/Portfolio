  - blocks:
      - type: callout
        title: UX Strategy & Methodology
        body: With a hard deadline and no time for traditional research, I relied on rapid prototyping and stakeholder alignment sessions to validate the concept before build - testing assumptions through paper sketches rather than user interviews.
        chips: [ Constraint-Driven Design, Stakeholder Validation, Gamified Experience ]
  - blocks:
      - type: head
        label: The problem
        num: "002"
        title: What I was asked to build
        sub:
          - "The brief was clear: build a <b>kiosk-style Progressive Web App</b> that could run simultaneously across multiple devices at the booth - capturing visitor interest, collecting contact data, and distributing a gamified reward."
          - As the <b>Project Lead</b> on this engagement, I owned the end-to-end design - from defining the user journey and interaction model to delivering the final UI for development handoff.
      - type: features
        items:
          - title: Engage booth visitors
            text: Create an experience compelling enough to stop foot traffic and hold attention on a busy trade floor.
          - title: Capture lead data
            text: Collect visitor contact information interactively - without it feeling like a cold form fill.
          - title: Reward participation
            text: Incentivise form completion with a branded gamified reward - a scratch-and-win coupon experience.
      - type: callout
        title: Aha Moment !
        body: The question wasn't just how do we show up - it was how do we make the <b>90 seconds a visitor spends at our booth count.</b>
  - blocks:
      - type: head
        title: Three problems hiding inside one request
        sub: What looked like a straightforward booth app unpacked into a set of layered technical and experience constraints - each requiring deliberate design decisions.
      - type: points
        one: true
        big: true
        rule: true
        items:
          - title: Getting 90 seconds without anyone noticing
            text: The moment a visitor feels like they're filling a form, they leave. The flow had to draw people in through curiosity and play - so they were already sharing their details before it felt like that's what they were doing.
          - title: Zero instruction on a loud, distracting floor
            text: No staff walking people through it. No onboarding screen. The UI had to be self-evident in under three seconds - legible mid-conversation, operable by anyone regardless of language or tech comfort.
          - title: Keeping the experience fresh for each person
            text: The app resets for every visitor. What feels exciting for the first person still had to land for the hundredth. The motion, anticipation, and scratch reveal couldn't feel like a loop - it had to feel like a moment.
          - title: Unreliable connectivity at a 100,000-person event
            text: Trade show WiFi is unreliable. Dead kiosks at peak hours wasn't an option. Every interaction had to be captured and stored locally - no server dependency, no risk.
  - band: true
    blocks:
      - type: head
        label: The Process
        num: "003"
        title: From a blank screen to a Genie in a bottle
        sub: The conceptual challenge was to connect Gapblue's AI brand to a human, playful moment at a busy exhibition booth. The name "Gnie" gave me a creative opening - a genie that grants wishes, reimagined for enterprise AI.
      - type: takeaways
        label: "Early sketches explored the visitor flow:"
        items:
          - What they see first, how they fill in data naturally
          - How the reward reveal creates a memorable peak moment
          - The scratch-and-win mechanic was chosen specifically because it combines tactile interaction (familiar from physical cards) with digital delight - something worth photographing and sharing.
      - type: image
        img: "13764:4191"
        w: 1312
        h: 700
        alt: Early sketches of the Gnie booth flow
        label: Sketches
      - type: principles
        tone: dark
        items:
          - title: The Genie character
            text: An animated Genie mascot was designed as the visual anchor - personifying Gnie's AI identity and giving the booth a recognisable, approachable face.
          - title: The gift box reveal
            text: A gift-box animation served as the transition between form completion and reward reveal - building anticipation before the scratch interaction begins
          - title: "Tech pivot: React → Next.js"
            text: The initial React build was migrated to Next.js to leverage better PWA support, offline caching via service workers, and improved cross-device rendering.
      - type: pair
        items:
          - { video: video-gnie-genie, poster: "13764:4209", ratio: 644/600, label: Genie character, alt: The animated Gnie genie mascot }
          - { video: video-gnie-gift, poster: "13764:4210", ratio: 644/600, label: Gift box reveal, alt: The sparkling gift-box reveal animation }
  - blocks:
      - type: head
        label: The Solution
        num: "004"
        title: A kiosk that works, with or without the internet
        sub: The final PWA was built on Next.js, deployed as a Progressive Web App, and optimised for installation on all three device families in kiosk mode. Every interaction state - from the initial landing screen to the scratch-and-win reveal — was designed to require zero user instruction.
      - type: points
        big: true
        items:
          - title: Universal cross-device compatibility
            text: Same layout, same touch targets, same animations - on Android tablets, iPad kiosks, and Microsoft Surface without a single platform-specific fix.
          - title: Fully offline lead capture
            text: Lead data stored locally via IndexedDB and service workers. No internet needed - everything reviewable on-device, syncable after the event.
          - title: Scratch-and-win gamification
            text: A digital scratch card revealed the reward - making data collection feel like participation, not a form fill. Tactile, memorable, and worth sticking around for.
          - title: Fair reward distribution system
            text: 10 coupons per day across 5 devices - pool controlled, distribution fair, no server required. Local state handled it all.
