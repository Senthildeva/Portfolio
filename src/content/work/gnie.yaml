sections:
  - blocks:
      - type: head
        label: The Setup
        num: "001"
        title: The client, the product, and the stage
        sub:
          - <b>Gapblue Software Labs</b> is a Kochi-based AI integrator building Gen AI - powered enterprise tools for SMEs across Asia and North America. Their flagship platform, <b>Gnie</b>, is an AI-driven productivity and performance management system - built to help businesses close the gap between human potential and business outcomes
          - "For October 2024, Gapblue had secured a booth at <b>GITEX Global</b> - the world's largest technology conference, held in Dubai, drawing over 100,000 attendees from 170+ countries. The stakes were high: this was Gapblue's moment to put Gnie in front of decision-makers, investors, and enterprise buyers at a single point in time."
